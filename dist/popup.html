<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="popup.css">
    <title>Bookwork Codes</title>
  </head>
  <body>
    <header>
      <h1>Bookwork Codes</h1>
      <div class="header-actions">
        <button id="settings-toggle" class="icon-button" type="button" title="Settings" aria-expanded="false" aria-controls="settings">⚙</button>
        <button id="clear" type="button">Clear</button>
      </div>
    </header>
    <section id="settings" class="settings" hidden>
      <label class="setting-row">
        <input id="theme-enabled" type="checkbox">
        <span>Enable Phi theme (looks ASS right now)</span>
      </label>
    </section>
    <main>
      <section id="latest" class="latest" hidden>
        <span class="label">Latest</span>
        <strong id="latest-code"></strong>
      </section>
      <ol id="history" class="history"></ol>
      <p id="empty" class="empty">No bookwork codes detected yet.</p>
    </main>
    <footer>
      <button id="export" type="button">Export CSV</button>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
